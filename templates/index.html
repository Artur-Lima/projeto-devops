<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projeto Integrador — {{ disciplina }}</title>
  <style>
    :root {
      --bg: #0f1420;
      --card: #171e2e;
      --line: #263049;
      --text: #e8ecf5;
      --muted: #8b97b0;
      --accent: #4ade80;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 40px;
      max-width: 620px;
      width: 100%;
    }
    .tag {
      display: inline-block;
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 999px;
      padding: 4px 12px;
      margin-bottom: 20px;
    }
    h1 { font-size: 28px; line-height: 1.25; margin-bottom: 8px; }
    .sub { color: var(--muted); font-size: 15px; margin-bottom: 32px; }
    h2 {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      margin-bottom: 12px;
    }
    ul { list-style: none; }
    li {
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
      font-size: 17px;
    }
    li:last-child { border-bottom: none; }
    footer {
      margin-top: 32px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 12px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    @media (max-width: 480px) {
      .card { padding: 28px 22px; }
      h1 { font-size: 23px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="tag">Projeto Integrador</span>
    <h1>{{ disciplina }}</h1>
    <p class="sub">{{ instituicao }}</p>

    <h2>Integrantes do grupo</h2>
    <ul>
      {% for nome in integrantes %}
      <li>{{ nome }}</li>
      {% endfor %}
    </ul>

    <footer>
      <span>commit {{ commit }}</span>
      <span>build {{ build_time }}</span>
    </footer>
  </main>
</body>
</html>
