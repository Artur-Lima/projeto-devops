---
# Mesmo modelo da N1: a aplicação roda como stack no Docker Swarm.
# Num servidor só, ele vira o manager de um cluster de 1 nó.

- name: Verificar estado do Swarm
  ansible.builtin.command: docker info --format '{% raw %}{{.Swarm.LocalNodeState}}{% endraw %}'
  register: swarm_state
  changed_when: false

- name: Inicializar o Swarm (só se ainda não estiver ativo)
  ansible.builtin.command: >
    docker swarm init
    --advertise-addr {{ swarm_advertise_addr | default(ansible_facts.default_ipv4.address | default(ansible_host)) }}
  when: swarm_state.stdout != 'active'
  changed_when: true

- name: Listar nós do cluster
  ansible.builtin.command: docker node ls
  register: swarm_nodes
  changed_when: false

- name: Mostrar nós do cluster
  ansible.builtin.debug:
    var: swarm_nodes.stdout_lines
