---
# Roda antes de coletar fatos, só com "raw" (SSH puro, sem Python no servidor).
# Motivo: o ansible-core atual exige Python >= 3.8 no servidor. Ubuntu/Debian
# recentes já têm; Oracle Linux 8 vem com 3.6 e precisa do python3.11.

# Não usamos wait_for_connection aqui porque ele precisa de Python no servidor.
# Para VM recém-criada, o ansible.cfg já tenta o SSH várias vezes ([ssh_connection] retries).

- name: Localizar (ou instalar) um Python >= 3.8
  ansible.builtin.raw: |
    achar() {  # o python3 do sistema vem primeiro: é ele que tem os módulos do apt/dnf
      for p in /usr/bin/python3 python3.13 python3.12 python3.11 python3.10 python3.9 python3; do
        b=$(command -v "$p" 2>/dev/null) || continue
        "$b" -c 'import sys; sys.exit(0 if sys.version_info >= (3, 8) else 1)' && { echo "$b"; return 0; }
      done
      return 1
    }
    achar && exit 0
    if command -v apt-get >/dev/null 2>&1; then
      apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3 >/dev/null
    elif command -v dnf >/dev/null 2>&1; then
      dnf install -y -q python3.11 >/dev/null
    elif command -v yum >/dev/null 2>&1; then
      yum install -y -q python3 >/dev/null
    fi
    achar
  register: python_detectado
  changed_when: false

- name: Usar esse Python no restante do playbook
  ansible.builtin.set_fact:
    ansible_python_interpreter: "{{ python_detectado.stdout_lines | last | trim }}"

- name: Mostrar interpretador escolhido
  ansible.builtin.debug:
    msg: "Python no servidor: {{ ansible_python_interpreter }}"
