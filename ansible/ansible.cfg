[defaults]
inventory = ./inventory.ini
roles_path = ./roles
# Servidor novo: a chave SSH dele ainda não está no known_hosts do control node.
host_key_checking = False
# O interpretador Python do servidor é descoberto na role "bootstrap"
# (Oracle Linux 8 vem com Python 3.6, que o ansible-core atual não suporta).
interpreter_python = auto_silent
retry_files_enabled = False
stdout_callback = default
callback_result_format = yaml

[ssh_connection]
pipelining = True
# VM recém-criada pode demorar para aceitar SSH: tenta de novo antes de desistir.
retries = 10
