# Inventário — servidor(es) Linux de destino.
#
# Troque o IP, o usuário e a chave pelos dados do servidor novo.
# Usuário padrão por imagem: Ubuntu = ubuntu | Oracle Linux = opc | Debian = debian
# O usuário precisa ter sudo (o playbook usa become).
#
# Teste de conexão antes de rodar:
#   ansible all -m ping

[app]
servidor-n2 ansible_host=203.0.113.10 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_ed25519

# Exemplo com senha em vez de chave (exige o pacote sshpass no control node):
# servidor-n2 ansible_host=203.0.113.10 ansible_user=aluno ansible_password=SENHA ansible_become_password=SENHA
