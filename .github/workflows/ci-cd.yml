name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # 1) TESTE — valida o código antes de gerar qualquer imagem
  test:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar testes
        run: pytest -v

  # 2) BUILD — cria a imagem Docker e publica no GHCR
  build:
    name: Build da imagem
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Nome do repositório em minúsculo
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}:latest
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}:${{ github.sha }}
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.run_started_at }}

  # 3) DEPLOY — atualiza o serviço no cluster Docker Swarm via SSH
  deploy:
    name: Deploy no Swarm
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Atualizar o serviço no cluster
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            IMAGE="ghcr.io/artur-lima/projeto-devops:${{ github.sha }}"
            echo "Atualizando para $IMAGE"
            docker service update \
              --image "$IMAGE" \
              --with-registry-auth \
              --update-order start-first \
              projeto-devops_app
            docker service ps projeto-devops_app --no-trunc
      - name: Resumo
        run: echo "Deploy aplicado em devops.cyberselva.com"