name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # 1) TESTE — valida o código antes de gerar qualquer imagem
  test:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar testes
        run: pytest -v

  # 2) BUILD — cria a imagem Docker e publica no GHCR
  build:
    name: Build da imagem
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Nome do repositório em minúsculo
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Data do build
        id: data
        run: echo "agora=$(date -u '+%d/%m/%Y %H:%M UTC')" >> "$GITHUB_OUTPUT"

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}:latest
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}:${{ github.sha }}
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.data.outputs.agora }}

  # 3) DEPLOY — dispara o webhook do Portainer, que puxa a imagem nova
  #    do GHCR e atualiza o serviço no cluster Docker Swarm.
  deploy:
    name: Deploy no Swarm
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Disparar webhook do Portainer
        run: |
          set -e
          echo "Disparando deploy do commit ${GITHUB_SHA::7}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.PORTAINER_WEBHOOK }}")
          echo "Portainer respondeu HTTP $STATUS"
          if [ "$STATUS" != "204" ] && [ "$STATUS" != "200" ]; then
            echo "Deploy falhou"
            exit 1
          fi

      - name: Aguardar o serviço responder com o novo commit
        run: |
          set -e
          ESPERADO="${GITHUB_SHA::7}"
          for i in $(seq 1 30); do
            ATUAL=$(curl -s https://arturdevops.duckdns.org/health | grep -o '"commit":"[^"]*"' | cut -d'"' -f4 || true)
            echo "tentativa $i — em produção: ${ATUAL:-indisponível} | esperado: $ESPERADO"
            if [ "$ATUAL" = "$ESPERADO" ]; then
              echo "Deploy confirmado em produção"
              exit 0
            fi
            sleep 10
          done
          echo "O serviço não respondeu com o commit novo dentro do tempo limite"
          exit 1