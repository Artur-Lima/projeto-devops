# Stack do Projeto Integrador para Docker Swarm (CyberSelva)
# Usa o Traefik já existente no cluster, na rede externa traefik_public.
# Não cria proxy próprio e não publica portas no host.
version: "3.8"

services:
  app:
    image: ghcr.io/artur-lima/projeto-devops:latest
    networks:
      - traefik_public
    environment:
      - TZ=America/Porto_Velho
    deploy:
      mode: replicated
      # 2 réplicas: se um container cai, o serviço continua no ar.
      replicas: 2
      placement:
        constraints:
          - node.hostname == srv1230142
      restart_policy:
        condition: on-failure
        delay: 5s
      update_config:
        order: start-first
        delay: 5s
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=traefik_public"
        - "traefik.http.routers.devops.rule=Host(`devops.cyberselva.com`)"
        - "traefik.http.routers.devops.entrypoints=websecure"
        - "traefik.http.routers.devops.tls=true"
        - "traefik.http.routers.devops.tls.certresolver=letsencrypt"
        - "traefik.http.services.devops.loadbalancer.server.port=8000"
        - "traefik.http.routers.devops-http.rule=Host(`devops.cyberselva.com`)"
        - "traefik.http.routers.devops-http.entrypoints=web"
        - "traefik.http.routers.devops-http.middlewares=devops-redirect"
        - "traefik.http.middlewares.devops-redirect.redirectscheme.scheme=https"
        - "traefik.http.middlewares.devops-redirect.redirectscheme.permanent=true"

  uptime-kuma:
    image: louislam/uptime-kuma:1
    networks:
      - traefik_public
    volumes:
      - devops_kuma_data:/app/data
    environment:
      - TZ=America/Porto_Velho
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.hostname == srv1230142
      restart_policy:
        condition: on-failure
        delay: 10s
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=traefik_public"
        - "traefik.http.routers.devopsstatus.rule=Host(`status-devops.cyberselva.com`)"
        - "traefik.http.routers.devopsstatus.entrypoints=websecure"
        - "traefik.http.routers.devopsstatus.tls=true"
        - "traefik.http.routers.devopsstatus.tls.certresolver=letsencrypt"
        - "traefik.http.services.devopsstatus.loadbalancer.server.port=3001"
        - "traefik.http.routers.devopsstatus-http.rule=Host(`status-devops.cyberselva.com`)"
        - "traefik.http.routers.devopsstatus-http.entrypoints=web"
        - "traefik.http.routers.devopsstatus-http.middlewares=devops-redirect"

volumes:
  devops_kuma_data:
    driver: local

networks:
  traefik_public:
    external: true
